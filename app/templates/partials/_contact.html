<!-- Contact Section -->
<section id="contact" class="landing-section mb-5">
    <div class="mb-4">
        <h4 class="section-title">Contact us</h4>
        <p class="text-secondary small mb-0">Have questions about Home Budget or need assistance? Reach out directly.</p>
    </div>

    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6 col-xl-5">
            <div class="custom-card contact-card p-4 p-md-5 text-center">
                <!-- Circular Avatar with initials "PD" -->
                <div class="contact-avatar mx-auto mb-3" aria-label="Initials {{ site_info.initials }}">
                    {{ site_info.initials }}
                </div>
                
                <h5 class="fw-bold mb-1">{{ site_info.name }}</h5>
                <div>
                    <span class="badge bg-primary-subtle text-primary rounded-pill px-3 py-1 mb-4 fw-medium">
                        {{ site_info.role }}
                    </span>
                </div>

                <div class="contact-details-list d-flex flex-column gap-3 text-start mx-auto w-100">
                    <!-- Phone Row -->
                    <div class="contact-item-row p-3 rounded-3 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3 overflow-hidden me-2">
                            <div class="contact-icon-box flex-shrink-0">
                                <i class="bi bi-telephone-fill"></i>
                            </div>
                            <div class="overflow-hidden">
                                <span class="contact-item-label d-block text-secondary">Phone</span>
                                <a href="{{ site_info.tel_link }}" class="contact-link fw-semibold text-truncate d-block">
                                    {{ site_info.phone }}
                                </a>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary copy-contact-btn flex-shrink-0 d-inline-flex align-items-center gap-1" data-copy="{{ site_info.phone }}" title="Copy Phone Number">
                            <i class="bi bi-clipboard"></i>
                            <span>Copy</span>
                        </button>
                    </div>

                    <!-- Email Row -->
                    <div class="contact-item-row p-3 rounded-3 d-flex align-items-center justify-content-between">
                        <div class="d-flex align-items-center gap-3 overflow-hidden me-2">
                            <div class="contact-icon-box flex-shrink-0">
                                <i class="bi bi-envelope-fill"></i>
                            </div>
                            <div class="overflow-hidden">
                                <span class="contact-item-label d-block text-secondary">Email</span>
                                <a href="{{ site_info.email_link }}" class="contact-link fw-semibold text-truncate d-block">
                                    {{ site_info.email }}
                                </a>
                            </div>
                        </div>
                        <button type="button" class="btn btn-sm btn-outline-primary copy-contact-btn flex-shrink-0 d-inline-flex align-items-center gap-1" data-copy="{{ site_info.email }}" title="Copy Email Address">
                            <i class="bi bi-clipboard"></i>
                            <span>Copy</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
